<script type="text/plain" id="snapshot"># はるみAIラボ タスク台帳

最終更新：2026-10-22

## 使い方

- 状態：未着手 / 作業中 / 確認待ち / 完了 / 保留
- 担当：永井 / Claude（チャット） / Claude Code
- 「決める：」で始まるものは、永井が判断するタスク。
- **完了にするのは、成果物が残ったときだけ。** 話し合っただけでは完了にしない。完了にしたら「成果物・メモ」欄に、何がどこにあるかを書き、下の「完了したもの」に移す（詳しくは CLAUDE.md の「完了の基準」）。
- 載せるのは、第1回の開催までに必要なことだけ。開催当日や開催後の作業は、第1回の内容が決まってから足す。
- 毎朝、定期実行のClaudeがメール・チャット・コミット履歴をもとに更新する。
- 工程表（ガントチャート）：https://yusukenagai.github.io/harumi_AI_lab/gantt.html 。このファイルを読み込んで自動で描くので、表やスケジュールの書き方（列の並び、「T-◯◯」の番号、時期の書き方「11月上旬（11/1〜11/15）」など）を崩さない。
- このファイルは公開されている。メールアドレス、登録者の情報、職員の個人名、メールの本文は書かない。

</script>
<script>
(function(){
  var DAY=86400000;
  var START=new Date(2026,9,19), END=new Date(2027,1,1); // 週は月曜はじまり。W1＝2026/10/19〜10/25、W15＝2027/1/25〜1/31
  var WEEK=7*DAY, NW=Math.round((END-START)/WEEK);
  var SPAN=(END-START)/DAY;
  var state={who:'all', data:null};

  function pct(d){return Math.max(0,Math.min(100,(d-START)/DAY/SPAN*100));}
  function wk(d){return Math.floor((d-START)/WEEK)+1;}
  function md(d){return (d.getMonth()+1)+'/'+d.getDate();}
  function yearOf(m){return m>=4?2026:2027;}
  function lastDay(y,m){return new Date(y,m,0).getDate();}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function cells(line){var p=line.split('|');p.shift();p.pop();return p.map(function(x){return x.trim();});}

  // 「10月下旬（〜10/31）」「11月上旬（11/1〜11/15）」「12月中旬〜下旬（〜12/28）」「1月上旬」を日付の範囲に
  function parsePeriod(label){
    var m=label.match(/(\d+)月(上旬|中旬|下旬)(?:〜(上旬|中旬|下旬))?/); if(!m) return null;
    var mon=+m[1], y=yearOf(mon), j={'上旬':[1,10],'中旬':[11,20],'下旬':[21,0]};
    var s=j[m[2]][0], eKey=m[3]||m[2], e=j[eKey][1]||lastDay(y,mon);
    var ex=label.match(/[（(]\s*(?:(\d+)\/(\d+))?\s*〜\s*(\d+)\/(\d+)\s*[)）]/);
    var start=new Date(y,mon-1,s), end=new Date(y,mon-1,e);
    if(ex){ if(ex[1]) start=new Date(yearOf(+ex[1]),+ex[1]-1,+ex[2]); end=new Date(yearOf(+ex[3]),+ex[3]-1,+ex[4]); }
    // 週単位にそろえる：週の後半（金〜日）に始まる時期は翌週から、週の前半に終わる時期は前の週まで
    var ws=wk(new Date(start.getTime()+3*DAY)), we=Math.max(ws,wk(new Date(end.getTime()-3*DAY)));
    return {start:new Date(START.getTime()+(ws-1)*WEEK),end:new Date(START.getTime()+we*WEEK-1)};
  }
  function expandIds(text){
    var ids=[]; text.replace(/T-(\d+)(?:〜T-(\d+))?/g,function(_,a,b){a=+a;b=b?+b:a;for(var i=a;i<=b;i++)ids.push(i);});
    return ids;
  }

  function parse(md){
    var col={goal:1,tasks:2}, lines=md.split(/\r?\n/), sec='', groups=[], cur=null, phases=[], week=[], done=[], updated='';
    lines.forEach(function(l){
      var h=l.match(/^##\s+(.*)/); if(h){sec=h[1].trim(); cur=null; if(/^[A-Z]\./.test(sec)){cur={title:sec,tasks:[]};groups.push(cur);} return;}
      var u=l.match(/^最終更新：\s*(\S+)/); if(u){updated=u[1];return;}
      if(/^\|\s*-/.test(l)) return;
      if(sec.indexOf('スケジュール')===0 && /^\|/.test(l)){
        var c=cells(l); if(c[0]==='時期'){col={goal:c.indexOf('ゴール'),tasks:c.indexOf('主なタスク')};return;}
        var r=parsePeriod(c[0]); if(!r) return; var gl=c[col.goal]||'', tk=c[col.tasks]||'';
        phases.push({label:c[0],goal:gl,ids:expandIds(tk),start:r.start,end:r.end,ms:!tk});
        return;
      }
      if(sec.indexOf('今週')===0){var w=l.match(/^\d+\.\s+(.*)/); if(w) week.push(w[1]); return;}
      if(sec.indexOf('完了')===0 && /^\|/.test(l)){var d=cells(l); if(d[0]!=='タスク') done.push({name:d[0],date:d[1]||''}); return;}
      if(cur && /^\|\s*T-\d+/.test(l)){
        var t=cells(l); cur.tasks.push({id:+t[0].slice(2),label:t[0],name:t[1],who:t[2],st:t[3],memo:t[4]||''});
      }
    });
    groups.forEach(function(g){g.tasks.forEach(function(t){
      var ps=phases.filter(function(p){return p.ids.indexOf(t.id)>=0;});
      if(ps.length){t.start=new Date(Math.min.apply(null,ps.map(function(p){return p.start;})));t.end=new Date(Math.max.apply(null,ps.map(function(p){return p.end;})));t.phases=ps.map(function(p){return p.label;}).join('、');}
    });});
    return {groups:groups,phases:phases,week:week,done:done,updated:updated};
  }

  function render(){
    var d=state.data, chart=document.getElementById('chart'), now=new Date(), h=[];
    // ヘッダー：月と時期
    h.push('<div class="grid"><div class="row head"><div class="lab">作業</div><div class="track">');
    for(var m=new Date(START.getFullYear(),START.getMonth(),1);m<END;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
      var l=pct(m<START?START:m); h.push('<span class="mon" style="left:'+l+'%">'+(m.getMonth()+1)+'月'+(m.getMonth()===0?'（2027）':'')+'</span>');
    }
    var nowW=wk(new Date());
    for(var i=0;i<NW;i++){var ws=new Date(START.getTime()+i*WEEK);h.push('<span class="wk'+(i+1===nowW?' now':'')+'" style="left:'+(i/NW*100)+'%;width:'+(100/NW)+'%"><b>W'+(i+1)+'</b>'+md(ws)+'</span>');}
    d.phases.forEach(function(p){var l=pct(p.start),w=pct(p.end)-l;h.push('<span class="phase'+(p.ms?' ms':'')+'" style="left:'+l+'%;width:'+w+'%" title="'+esc(p.label+'：'+p.goal)+'">'+esc(p.goal)+'</span>');});
    h.push('</div></div>');
    var nodate=[];
    d.groups.forEach(function(g){
      var ts=g.tasks.filter(match); if(!ts.length) return;
      h.push('<div class="row group"><div class="lab">'+esc(g.title)+'</div><div class="track"></div></div>');
      ts.sort(function(a,b){return (a.start||END)-(b.start||END)||a.id-b.id;}).forEach(function(t){h.push(row(t,now));});
    });
    // 目盛りの縦線と今日の線
    h.push('<div class="overlay">');
    for(var k=1;k<NW;k++){h.push('<i class="vline" style="left:'+(k/NW*100)+'%"></i>');}
    if(now>=START&&now<END){var tl=pct(now);h.push('<i class="todayline" style="left:'+tl+'%"></i><span class="todaytag" style="left:'+tl+'%">今日 '+(now.getMonth()+1)+'/'+now.getDate()+'</span>');}
    h.push('</div></div>');
    chart.innerHTML=h.join('');
  }
  function match(t){return state.who==='all'||t.who.indexOf(state.who)>=0;}
  function row(t,now){
    var bar;
    if(t.start){
      var late=t.end<now&&t.st!=='完了';
      var l=pct(t.start),w=Math.max(.6,pct(t.end)-l);
      t.wk='W'+wk(t.start)+(wk(t.end)!==wk(t.start)?'〜W'+wk(t.end):'');
      bar='<i class="bar '+esc(t.st)+(late?' late':'')+'" style="left:'+l+'%;width:'+w+'%" title="'+esc(t.label+' '+t.wk+'（'+md(t.start)+'〜'+md(t.end)+'）'+(late?' 目安を過ぎています':''))+'"></i>';
    } else bar='<span class="nodate">時期未定</span>';
    return '<div class="row"><div class="lab"><div class="name"><span class="id">'+esc(t.label)+'</span>'+esc(t.name)+'</div>'+
      '<div class="meta"><span class="chip st-'+esc(t.st)+'">'+esc(t.st)+'</span>'+(t.wk?'<span class="wkchip">'+t.wk+'</span>':'')+'<span class="who">'+esc(t.who)+'</span></div></div>'+
      '<div class="track" title="'+esc(t.memo)+'">'+bar+'</div></div>';
  }
  function renderSide(){
    var d=state.data;
    if(d.week.length){document.getElementById('weekList').innerHTML=d.week.map(function(w){return '<li>'+esc(w)+'</li>';}).join('');document.getElementById('week').hidden=false;}
    if(d.done.length){document.getElementById('doneList').innerHTML=d.done.map(function(x){return '<li>'+esc(x.name)+' <small>'+esc(x.date)+'</small></li>';}).join('');document.getElementById('done').hidden=false;}
  }
  function start(md,from){
    state.data=parse(md);
    var n=0; state.data.groups.forEach(function(g){n+=g.tasks.length;});
    document.getElementById('src').innerHTML='台帳（TASKS.md）の最終更新：<b>'+esc(state.data.updated||'不明')+'</b>　・　残りの作業 '+n+'件　・　'+from;
    renderSide(); render();
  }
  document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){
    state.who=b.dataset.who; document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); render();
  });});

  var snap=document.getElementById('snapshot').textContent;
  fetch('TASKS.md',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();})
    .then(function(t){if(t.indexOf('## スケジュール')<0)throw 0;start(t,'GitHubの最新の台帳から表示');})
    .catch(function(){start(snap,'保存時点の台帳の写しから表示');});
})();
</script>
